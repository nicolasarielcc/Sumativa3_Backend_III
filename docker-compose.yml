name: banco-xyz-bff

services:
  mysql:
    image: mysql:8.4
    container_name: banco-xyz-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: banco_xyz
      MYSQL_USER: banco_user
      MYSQL_PASSWORD: banco_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - banco_xyz_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    container_name: banco-xyz-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    container_name: banco-xyz-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: banco-xyz-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"

  auth-server:
    build:
      context: .
      dockerfile: auth-server/Dockerfile
    container_name: banco-bff-auth-server
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    ports:
      - "9000:9000"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy

  banco-batch:
    build:
      context: .
      dockerfile: banco-batch/Dockerfile
    container_name: banco-bff-batch
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: banco_user
      DB_PASSWORD: banco_password
      BATCH_RUN_ON_STARTUP: "true"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  backend-core:
    build:
      context: .
      dockerfile: backend-core/Dockerfile
    container_name: banco-bff-core
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: banco_user
      DB_PASSWORD: banco_password
      JWK_SET_URI: "http://auth-server:9000/oauth2/jwks"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      auth-server:
        condition: service_started
      kafka:
        condition: service_healthy

  bff-web:
    build:
      context: .
      dockerfile: bff-web/Dockerfile
    container_name: banco-bff-web
    environment:
      BACKEND_CORE_URL: "https://backend-core:8081"
      JWK_SET_URI: "http://auth-server:9000/oauth2/jwks"
      AUTH_SERVER_TOKEN_URI: "http://auth-server:9000/oauth2/token"
      OAUTH2_CLIENT_ID: "bff-web-client"
      OAUTH2_CLIENT_SECRET: "web-secret"
    ports:
      - "8082:8082"
    depends_on:
      backend-core:
        condition: service_started
      auth-server:
        condition: service_started

  bff-mobile:
    build:
      context: .
      dockerfile: bff-mobile/Dockerfile
    container_name: banco-bff-mobile
    environment:
      BACKEND_CORE_URL: "https://backend-core:8081"
      JWK_SET_URI: "http://auth-server:9000/oauth2/jwks"
      AUTH_SERVER_TOKEN_URI: "http://auth-server:9000/oauth2/token"
      OAUTH2_CLIENT_ID: "bff-mobile-client"
      OAUTH2_CLIENT_SECRET: "mobile-secret"
    ports:
      - "8083:8083"
    depends_on:
      backend-core:
        condition: service_started
      auth-server:
        condition: service_started

  bff-atm:
    build:
      context: .
      dockerfile: bff-atm/Dockerfile
    container_name: banco-bff-atm
    environment:
      BACKEND_CORE_URL: "https://backend-core:8081"
      JWK_SET_URI: "http://auth-server:9000/oauth2/jwks"
      AUTH_SERVER_TOKEN_URI: "http://auth-server:9000/oauth2/token"
      OAUTH2_CLIENT_ID: "bff-atm-client"
      OAUTH2_CLIENT_SECRET: "atm-secret"
    ports:
      - "8084:8084"
    depends_on:
      backend-core:
        condition: service_started
      auth-server:
        condition: service_started

  notificaciones-service:
    build:
      context: .
      dockerfile: notificaciones-service/Dockerfile
    container_name: banco-bff-notificaciones
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    ports:
      - "8085:8085"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  banco_xyz_data:
