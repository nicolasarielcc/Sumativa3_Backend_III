spring.application.name=banco-batch
server.port=8080

# ===================== MySQL (docker-compose) =====================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/banco_xyz?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:banco_user}
spring.datasource.password=${DB_PASSWORD:banco_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Crear las tablas de negocio (schema.sql) en cada arranque (idempotente)
spring.sql.init.mode=always

# Ejecutar el job automaticamente al iniciar (env BATCH_RUN_ON_STARTUP=true en Docker)
batch.run-on-startup=${BATCH_RUN_ON_STARTUP:false}

# ===================== Spring Batch =====================
# No ejecutar los jobs automaticamente al iniciar (se disparan via /api/batch/...)
spring.batch.job.enabled=false
# Crear automaticamente las tablas de metadatos de Spring Batch
spring.batch.jdbc.initialize-schema=always

logging.level.cl.duoc.banco.bff=DEBUG
