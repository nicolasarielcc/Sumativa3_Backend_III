spring.application.name=banco-bff-core
server.port=8081

# ===================== HTTPS (certificado autofirmado) =====================
server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore/keystore.p12
server.ssl.key-store-password=banco123
server.ssl.key-alias=banco-bff
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# ===================== MySQL (docker-compose) =====================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/banco_xyz?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:banco_user}
spring.datasource.password=${DB_PASSWORD:banco_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===================== Seguridad (JWT compartido) =====================
app.security.jwt-secret=banco-xyz-super-secreto-jwt-hs256-compartido-2024
app.security.jwt-expiration-ms=3600000
app.security.jwt-issuer=banco-xyz-bff

logging.level.cl.duoc.banco.bff=DEBUG
